[project]
name = "pianodoom"
version = "0.1.0"
description = "Play Doom on a MIDI piano: piano keys and pedals become a virtual keyboard"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "mido>=1.3",
    "python-rtmidi>=1.5",
    "evdev>=1.7; sys_platform == 'linux'",
]

[project.scripts]
pianodoom = "pianodoom.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
