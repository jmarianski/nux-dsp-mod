<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>doom-piano emulator</title>
<style>
  :root { --bg: #16181a; --fg: #d8dcd2; --dim: #8a9087; --lcd-off: #9fb08a; --lcd-on: #1d2618; --line: #33373a; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, sans-serif; }
  main { max-width: 820px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 18px; margin: 0 0 12px; }
  canvas { width: 100%; max-width: 768px; aspect-ratio: 2 / 1; image-rendering: pixelated; display: block;
           border: 10px solid #2b302a; border-radius: 6px; background: var(--lcd-off); }
  .row { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin: 12px 0; }
  button, select { background: #262a2c; color: var(--fg); border: 1px solid var(--line); border-radius: 4px;
                   padding: 4px 10px; font: inherit; }
  .dim { color: var(--dim); }
  #log { font: 12px/1.3 ui-monospace, monospace; color: var(--dim); white-space: pre; height: 9em; overflow: auto;
         border: 1px solid var(--line); padding: 6px; }
  kbd { border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; }
</style>
</head>
<body>
<main>
  <h1>doom-piano: emulator P16</h1>
  <canvas id="lcd" width="128" height="64"></canvas>
  <div class="row">
    <button id="reload">Przeładuj (R)</button>
    <button id="pause">Pauza</button>
    <label>VOL <input id="vol" type="range" min="0" max="10" value="7"></label>
    <span id="stats" class="dim"></span>
  </div>
  <div class="row">
    <button id="midi">Włącz MIDI</button>
    <label>wyjście <select id="mout"><option value="">—</option></select></label>
    <label>wejście <select id="min"><option value="">—</option></select></label>
  </div>
  <p class="dim">Klawisze: <kbd>←</kbd>/<kbd>→</kbd> obrót, <kbd>↑</kbd>/<kbd>↓</kbd> przód/tył, <kbd>Q</kbd>/<kbd>E</kbd> bokiem
    (też <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd>). Z pianina: B2 C3 C#3 D3 D#3 E3 F3, jak na urządzeniu.
    Po zmianie kodu: przeładuj (serwer <code>tools/webserve.py</code> przebudowuje sam).</p>
  <div id="log"></div>
</main>
<script src="p16.js"></script>
<script src="main.js"></script>
</body>
</html>
